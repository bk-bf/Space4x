name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    outputs:
      typecheck: ${{ steps.scope.outputs.typecheck }}
      lint: ${{ steps.scope.outputs.lint }}
      knip: ${{ steps.scope.outputs.knip }}
      format: ${{ steps.scope.outputs.format }}
      unit: ${{ steps.scope.outputs.unit }}
      layout: ${{ steps.scope.outputs.layout }}
      tauri: ${{ steps.scope.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) base="$BEFORE" ;;
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            *) base="" ;;
          esac
          node tools/ci/scope.mjs --base "$base"

  typecheck:
    needs: scope
    if: needs.scope.outputs.typecheck == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:types

  lint:
    needs: scope
    if: needs.scope.outputs.lint == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm lint

  knip:
    needs: scope
    if: needs.scope.outputs.knip == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  format:
    needs: scope
    if: needs.scope.outputs.format == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm format:check

  unit:
    needs: scope
    if: needs.scope.outputs.unit == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm test

  layout:
    needs: scope
    if: needs.scope.outputs.layout == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - run: pnpm test:layout
      - uses: actions/upload-artifact@v7.0.2
        if: failure() && runner.environment == 'github-hosted'
        with:
          name: layout-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - run: gh-issue artifact put layout-results test-results/ playwright-report/ --if-no-files-found ignore
        if: failure() && runner.environment == 'self-hosted'

  tauri:
    needs: scope
    if: needs.scope.outputs.tauri == 'true'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
      - run: mkdir -p build && touch build/index.html
      - run: pnpm check:tauri
